name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check src/

      - name: Architecture boundaries
        run: uv run lint-imports

      # One coverage pass over every suite: CRAP is computed from it, and
      # splitting the runs would make code covered only by the acceptance
      # tests look untested. Test helpers are included in the CRAP inventory.
      - name: Tests (unit, property, acceptance)
        run: uv run pytest --cov --cov-report=json -q

      - name: CRAP score
        run: uv run python scripts/crap.py src scripts tests

      - name: Docs build
        run: uv run mkdocs build --strict

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - id: mutate
        name: Mutate the domain logic
        run: |
          echo "started_ns=$(date +%s%N)" >> "$GITHUB_OUTPUT"
          uv run mutmut run

      - name: Mutation score
        if: always()
        env:
          MUTATION_RUN_OUTCOME: ${{ steps.mutate.outcome }}
          MUTATION_RUN_STARTED_NS: ${{ steps.mutate.outputs.started_ns }}
          MUTATION_EXPECTED_GIT_SHA: ${{ github.sha }}
        run: uv run python scripts/mutation_score.py

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence-${{ github.sha }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/mutation-score.json
            mutants/worldcover-raster-mutants.json
          if-no-files-found: warn
          retention-days: 90

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t osm-worldcover .
      - name: Image runs
        run: docker run --rm osm-worldcover --help
