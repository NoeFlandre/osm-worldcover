name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check src/

      - name: Architecture boundaries
        run: uv run lint-imports

      # One coverage pass over every suite: CRAP is computed from it, and
      # splitting the runs would make code covered only by the acceptance
      # tests look untested. Test helpers are included in the CRAP inventory.
      - name: Tests (unit, property, acceptance)
        run: uv run pytest --cov --cov-report=json -q

      - name: CRAP score
        run: uv run python scripts/crap.py src scripts tests

      - name: Docs build
        run: uv run mkdocs build --strict

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Mutate the domain logic
        run: uv run mutmut run

      - name: Mutation score
        run: uv run python scripts/mutation_score.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t osm-worldcover .
      - name: Image runs
        run: docker run --rm osm-worldcover --help
