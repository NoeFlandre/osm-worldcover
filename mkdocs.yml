site_name: osm-worldcover
site_description: Supervised ESA WorldCover datasets built from OSM polygon text sources
repo_url: https://github.com/NoeFlandre/osm-worldcover
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.sections, content.code.copy]
nav:
  - Home: index.md
  - How it works: pipeline.md
  - Dataset schema: schema.md
  - Glossary: glossary.md
  - Technical debt: technical-debt.md
  - Duplication review: duplication-review.md
  - Decisions:
      - ADR 0001 WorldCover over CORINE: adr/0001-worldcover-instead-of-corine.md
      - ADR 0002 Coverage relative to the polygon: adr/0002-coverage-relative-to-the-polygon.md
      - ADR 0003 Geographic splits via H3: adr/0003-geographic-splits-via-h3.md
      - ADR 0004 Streaming tiles: adr/0004-streaming-tiles.md
      - ADR 0005 Polygon size cap: adr/0005-polygon-size-cap.md
      - ADR 0006 Source recipes: adr/0006-source-recipes-and-generic-repository.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
