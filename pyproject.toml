[project]
name = "osm-worldcover"
version = "0.1.0"
description = "Build supervised ESA WorldCover datasets from OSM polygon text sources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Noe Flandre" }]
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "h3>=4.1",
    "huggingface-hub>=0.26",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rasterio>=1.5",
    "exactextract>=0.3",
    "matplotlib>=3.9",
]

[project.scripts]
owc = "osm_worldcover.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-bdd>=8.1",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "ty>=0.0.1a1",
    "mutmut>=3.2",
    "radon>=6.0",
    "import-linter>=2.1",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "osm_worldcover"
module-root = "src"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "N", "RUF", "ARG", "PTH", "TRY", "RET"]
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs real external data (network or large local files)",
    "slow: long running",
]
filterwarnings = [
    "error",
    # rasterio's own transform helper, not our call site.
    "ignore:Use `@` matmul instead:PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/osm_worldcover", "scripts", "tests"]
branch = true

[tool.mutmut]
# Mutation testing runs over src/osm_worldcover and scripts, minus the
# do_not_mutate entries below. Those are the CLI, the network and filesystem
# adapters (coverage_map, hub, publish, source, writer) and the card template in
# domain/card.py, whose behaviour is asserted in tests/unit/test_card.py. Audit
# modules are mutated; their genuine I/O functions carry narrow
# "# pragma: no mutate block" markers instead of whole-file exclusions.
source_paths = ["src/osm_worldcover", "scripts"]
do_not_mutate = [
    "*/adapters/audit/card.py",
    "*/adapters/coverage_map.py",
    "*/adapters/hub.py",
    "*/adapters/publish.py",
    "*/adapters/source.py",
    "*/adapters/writer.py",
    "*/cli.py",
    # card.py is a prose template. Its mutants rewrite headings, URLs and join
    # separators, which changes the wording of a README and nothing else; the
    # card's actual behaviour is asserted in tests/unit/test_card.py.
    "*/domain/card.py",
]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/property", "tests/acceptance"]
